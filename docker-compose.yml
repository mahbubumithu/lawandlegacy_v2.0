services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: lawandlegacy-app:latest
    container_name: lawandlegacy-app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - DATABASE_PATH=/app/data/lawandlegacy.db
    volumes:
      - sqlite_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/api/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1); }).on('error', () => process.exit(1));\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  sqlite_data:
    name: lawandlegacy_sqlite_data
